name: Docker CI/CD Build & Deployment Pipeline

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: 🧪 Run Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Checks
        run: |
          npm run format:check
          npm run lint

      - name: Database Migration & Generation
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-ci-jwt-key-min-32-characters-long
          NODE_ENV: test
        run: |
          npm run db:generate
          npm run db:migrate --workspace=server

      - name: Run Master Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-ci-jwt-key-min-32-characters-long
          NODE_ENV: test
          SKIP_RATE_LIMIT: 'true'
        run: npm run test --workspace=server

  build-and-push:
    name: 🐳 Build & Push Docker Images to GHCR
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Express API Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/server:latest
            ghcr.io/${{ github.repository }}/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Next.js Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:latest
            ghcr.io/${{ github.repository }}/client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push BullMQ Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy Stack via SSH to Remote Host
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on Remote Host..."

            # Create deployment directory if not present
            mkdir -p ~/app && cd ~/app

            # Authenticate with GHCR on remote server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            # Pull latest containers
            docker pull ghcr.io/${{ github.repository }}/server:latest || true
            docker pull ghcr.io/${{ github.repository }}/client:latest || true
            docker pull ghcr.io/${{ github.repository }}/worker:latest || true

            # Restart containers via docker compose
            if [ -f docker-compose.prod.yml ]; then
              IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d --remove-orphans
              docker compose -f docker-compose.prod.yml exec -T server npx prisma migrate deploy
            fi

            echo "✅ Deployment Successfully Completed!"
