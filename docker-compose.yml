version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace_postgres
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_pass
      POSTGRES_DB: workspace_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace_user -d workspace_db']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: workspace_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: workspace_server
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://workspace_user:workspace_pass@postgres:5432/workspace_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: super-secret-refresh-jwt-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: workspace_client
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
