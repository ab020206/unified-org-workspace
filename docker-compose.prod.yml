version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_workspace_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prod_workspace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-prod_workspace_db}
    ports:
      - '5432:5432'
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prod_workspace_user} -d ${POSTGRES_DB:-prod_workspace_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: prod_workspace_redis
    ports:
      - '6379:6379'
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: prod_workspace_server
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-prod_workspace_user}:${POSTGRES_PASSWORD:-prod_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-prod_workspace_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-production-jwt-key-min-32-characters-required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: prod_workspace_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-prod_workspace_user}:${POSTGRES_PASSWORD:-prod_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-prod_workspace_db}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: prod_workspace_client
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    depends_on:
      - server
    restart: always

  reverse_proxy:
    image: nginx:1.25-alpine
    container_name: prod_workspace_proxy
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
    restart: always

volumes:
  prod_postgres_data:
  prod_redis_data:
